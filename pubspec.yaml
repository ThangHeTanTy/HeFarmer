name: hefarmer
description: "HeFarmer — theo dõi giá nông sản, vật nuôi, vật tư, vàng bạc và dự báo thời tiết cho bà con nông dân."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  geolocator: ^14.0.3
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^18.0.1
  flutter_tts: ^4.2.0
  workmanager: ^0.10.10
  sqflite: ^2.4.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

# Cấu hình sinh icon app: chạy  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#7ED0F5"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21
