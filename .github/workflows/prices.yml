# MÁY CHỦ GIÁ HeFarmer — chạy miễn phí trên GitHub Actions.
# Cứ 30 phút (6h–20h giờ Việt Nam) đọc các trang nguồn MỘT LẦN, rồi đăng
# file JSON lên nhánh `data`. Ứng dụng tải file này thay vì mỗi máy tự đọc
# ~80 trang web.
#
# Lưu ý:
#  - Lịch chạy (schedule) chỉ có hiệu lực khi file này nằm trên nhánh mặc
#    định (main). Muốn chạy ngay: tab Actions > "Cập nhật giá" > Run workflow.
#  - GitHub tự tắt lịch chạy nếu kho mã không có hoạt động trong 60 ngày;
#    khi đó vào tab Actions bấm bật lại.
name: Cập nhật giá

on:
  schedule:
    # Giờ UTC: 23h–13h UTC = 6h–20h giờ Việt Nam
    - cron: "7,37 23,0-13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Dữ liệu lần trước (lịch sử giá + giá cũ khi nguồn lỗi).
      # Lần chạy đầu tiên chưa có nhánh data -> bỏ qua.
      - name: Lấy dữ liệu lần trước
        id: previous
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: data
          path: previous-data

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true

      - run: flutter pub get

      - name: Tổng hợp giá
        run: dart run tool/build_prices.dart --previous previous-data --out price-data

      # Đăng thành 1 commit duy nhất (ghi đè) để kho mã không phình to
      - name: Đăng lên nhánh data
        working-directory: price-data
        run: |
          git init -q -b data
          git config user.name "hefarmer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Cập nhật giá $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
